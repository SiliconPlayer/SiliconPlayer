name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8

jobs:
  build:
    name: Build optimizedDebug APK
    runs-on: ubuntu-24.04
    env:
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools platforms;android-36 build-tools;36.1.0 ndk;29.0.14206865 cmake;3.22.1

      - name: Compute native deps cache key
        id: deps-cache-key
        shell: bash
        run: |
          set -euo pipefail
          # silicon_vis is built by the app's CMake, not by the deps scripts.
          EXTERNAL_TREE_HASH="$(git ls-tree -r HEAD -- external | grep -v $'\t'external/silicon/silicon_vis/ | git hash-object --stdin)"
          echo "key=native-deps-${{ runner.os }}-all_legacy-${EXTERNAL_TREE_HASH}" >> "${GITHUB_OUTPUT}"

      - name: Restore native deps cache
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: app/src/main/cpp/prebuilt
          key: ${{ steps.deps-cache-key.outputs.key }}

      - name: Install native build prerequisites
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake ninja-build perl
          sudo apt-get install -y xa65 || sudo apt-get install -y xa

      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: ./external/build_deps.sh all_legacy all

      - name: Save native deps cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: app/src/main/cpp/prebuilt
          key: ${{ steps.deps-cache-key.outputs.key }}

      - name: Build optimizedDebug APK
        run: ./gradlew assembleOptimizedDebug -PenableX86=true --no-daemon --stacktrace

      - name: Prepare artifacts
        run: |
          version=$(grep -oP '^siliconplayer\.version=\K.+' gradle.properties)
          sha=$(git rev-parse --short HEAD)
          for apk in app/build/outputs/apk/optimizedDebug/*.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.*)-optimizedDebug\.apk$/\1/')
            mv "$apk" "app/build/outputs/apk/optimizedDebug/SiliconPlayer-$version-optdebug-$sha-$abi.apk"
          done

      - name: Upload arm64-v8a artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/optimizedDebug/*arm64-v8a.apk
          archive: false
          if-no-files-found: error

      - name: Upload armeabi-v7a artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/optimizedDebug/*armeabi-v7a.apk
          archive: false
          if-no-files-found: error

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/optimizedDebug/*x86_64.apk
          archive: false
          if-no-files-found: error

      - name: Upload x86 artifact
        uses: actions/upload-artifact@v7
        with:
          path: app/build/outputs/apk/optimizedDebug/*-x86.apk
          archive: false
          if-no-files-found: error

  desktop:
    name: Build desktop packages
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake ninja-build perl
          sudo apt-get install -y xa65 || sudo apt-get install -y xa
          sudo apt-get install -y libasound2-dev libpulse-dev libx11-dev libgl1-mesa-dev libvulkan-dev zlib1g-dev
          sudo apt-get install -y libfuse2 fakeroot

      - name: Compute desktop deps cache key
        id: deps-cache-key
        shell: bash
        run: |
          set -euo pipefail
          # silicon_vis is built by the app's CMake, not by the deps scripts.
          EXTERNAL_TREE_HASH="$(git ls-tree -r HEAD -- external | grep -v $'\t'external/silicon/silicon_vis/ | git hash-object --stdin)"
          echo "key=desktop-deps-${{ runner.os }}-x86_64-${EXTERNAL_TREE_HASH}" >> "${GITHUB_OUTPUT}"

      - name: Restore desktop deps cache
        id: deps-cache
        uses: actions/cache/restore@v6
        with:
          path: desktop/prebuilt
          key: ${{ steps.deps-cache-key.outputs.key }}

      - name: Build desktop native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: BUILD_FFMPEG_SOURCE=1 ./external/build_deps_desktop.sh x86_64 all

      - name: Save desktop deps cache
        if: steps.deps-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v6
        with:
          path: desktop/prebuilt
          key: ${{ steps.deps-cache-key.outputs.key }}

      - name: Build release distributable
        run: ./gradlew :desktop:createReleaseDistributable --no-daemon --stacktrace

      - name: Package AppImage
        run: ./desktop/package-appimage.sh

      - name: Package deb and bare tarball
        run: |
          ./desktop/package-deb.sh
          ./desktop/package-tarball.sh

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v7
        with:
          path: desktop/build/compose/binaries/main-release/SiliconPlayer-*-x86_64.AppImage
          archive: false
          if-no-files-found: error

      - name: Upload deb artifact
        uses: actions/upload-artifact@v7
        with:
          path: desktop/build/compose/binaries/main-release/SiliconPlayer-*-x86_64.deb
          archive: false
          if-no-files-found: error

      - name: Upload bare tarball artifact
        uses: actions/upload-artifact@v7
        with:
          path: desktop/build/compose/binaries/main-release/SiliconPlayer-*-x86_64.tar.gz
          archive: false
          if-no-files-found: error

  arch:
    name: Build Arch package
    runs-on: ubuntu-24.04
    container:
      image: archlinux:base-devel
    steps:
      - name: Install container prerequisites
        run: |
          pacman -Syu --noconfirm git sudo
          useradd -m builder
          echo 'builder ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/builder
          mkdir -p /home/builder/.gradle

      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Mark workspace as git safe directory
        run: git config --system --add safe.directory "$GITHUB_WORKSPACE"

      - name: Compute desktop deps cache key
        id: deps-cache-key
        shell: bash
        run: |
          set -euo pipefail
          # silicon_vis is built by the app's CMake, not by the deps scripts.
          EXTERNAL_TREE_HASH="$(git ls-tree -r HEAD -- external | grep -v $'\t'external/silicon/silicon_vis/ | git hash-object --stdin)"
          echo "key=desktop-deps-${{ runner.os }}-x86_64-${EXTERNAL_TREE_HASH}" >> "${GITHUB_OUTPUT}"

      - name: Restore desktop deps cache
        uses: actions/cache/restore@v6
        with:
          path: desktop/prebuilt
          key: ${{ steps.deps-cache-key.outputs.key }}

      - name: Restore Gradle cache
        uses: actions/cache@v6
        with:
          path: /home/builder/.gradle/caches
          key: arch-gradle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/gradle-wrapper.properties', 'buildSrc/**/Versions.kt', 'buildSrc/**/Dependencies.kt', 'gradle/*.versions.toml', '**/versions.properties') }}

      - name: Restore Gradle wrapper cache
        uses: actions/cache@v6
        with:
          path: /home/builder/.gradle/wrapper
          key: arch-gradle-wrapper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('**/gradle-wrapper.properties') }}

      - name: Fix cache ownership for builder
        run: |
          mkdir -p desktop/prebuilt
          chown -R builder:builder /home/builder/.gradle desktop/prebuilt

      - name: Build package
        run: |
          set -euo pipefail
          rm -rf /tmp/archpkg
          mkdir -p /tmp/archpkg/src
          cp -a "$GITHUB_WORKSPACE" /tmp/archpkg/src/siliconplayer
          cp desktop/packaging/arch/PKGBUILD desktop/packaging/arch/siliconplayer.sh desktop/packaging/arch/siliconplayer.desktop /tmp/archpkg/
          chown -R builder:builder /tmp/archpkg
          su builder -c 'cd /tmp/archpkg && makepkg -se --noconfirm'

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp /tmp/archpkg/siliconplayer-[0-9]*.pkg.tar.zst dist/

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v7
        with:
          path: dist/*.pkg.tar.zst
          archive: false
          if-no-files-found: error

  publish:
    name: Publish experimental release
    needs: [build, desktop, arch]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: release

      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag=experimental
          version=$(grep -oP '^siliconplayer\.version=\K.+' gradle.properties)
          sha=$(git rev-parse --short HEAD)
          if prev=$(git rev-parse -q --verify "refs/tags/$tag"); then
            changes=$(git log --format='- %h %s' "$prev..HEAD" | grep -v '^-[0-9a-f]\+ ci:' || true)
            [ -n "$changes" ] || changes='- No code changes since the previous build'
          else
            changes=$(git log --format='- %h %s' -15 HEAD)
          fi
          notes=$(printf 'Experimental build from commit %s. This build is auto-generated on every master push, expect instability.\n\n## Changes\n%s\n' "$sha" "$changes")

          gh release delete "$tag" --cleanup-tag --yes || true
          gh release create "$tag" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "SiliconPlayer $version (build ${{ github.run_number }})" \
            --notes "$notes" \
            release/*
