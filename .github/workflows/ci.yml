name: CI

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build optimizedDebug APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_NDK_HOME: /usr/local/lib/android/sdk/ndk/29.0.14206865

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK tools
        uses: android-actions/setup-android@v3
        with:
          # Defaults pull the removed "tools" package.
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" \
            "platform-tools" \
            "platforms;android-34" \
            "build-tools;36.1.0" \
            "ndk;29.0.14206865" \
            "cmake;3.22.1"

      - name: Accept Android SDK licenses
        run: yes | sdkmanager --sdk_root="${ANDROID_SDK_ROOT}" --licenses || true

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake ninja-build perl
          sudo apt-get install -y xa65 || sudo apt-get install -y xa
          command -v xa

      - name: Configure git identity for patch application
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Add NDK gcc compatibility wrappers for OpenSSL configure
        run: |
          set -euo pipefail
          WRAPPER_DIR="/tmp/ndk-gcc-compat"
          mkdir -p "${WRAPPER_DIR}"

          cat > "${WRAPPER_DIR}/aarch64-linux-android-gcc" <<'EOF'
          #!/usr/bin/env bash
          exec "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang" "$@"
          EOF
          cat > "${WRAPPER_DIR}/arm-linux-androideabi-gcc" <<'EOF'
          #!/usr/bin/env bash
          exec "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang" "$@"
          EOF
          cat > "${WRAPPER_DIR}/x86_64-linux-android-gcc" <<'EOF'
          #!/usr/bin/env bash
          exec "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/x86_64-linux-android26-clang" "$@"
          EOF
          cat > "${WRAPPER_DIR}/i686-linux-android-gcc" <<'EOF'
          #!/usr/bin/env bash
          exec "${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin/i686-linux-android26-clang" "$@"
          EOF

          chmod +x "${WRAPPER_DIR}"/*-linux-android-gcc
          echo "${WRAPPER_DIR}" >> "${GITHUB_PATH}"

      - name: Verify debug signing key
        run: test -f debug.keystore

      - name: Compute native deps cache key
        id: deps-cache-key
        shell: bash
        run: |
          set -euo pipefail
          EXTERNAL_TREE_HASH="$(git rev-parse HEAD:external)"
          echo "key=native-deps-${{ runner.os }}-ndk29-api21-all_legacy-${EXTERNAL_TREE_HASH}" >> "${GITHUB_OUTPUT}"

      - name: Restore native deps cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: app/src/main/cpp/prebuilt
          key: ${{ steps.deps-cache-key.outputs.key }}

      - name: Build native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x external/build_deps*.sh
          ./external/build_deps.sh all_legacy all

      - name: Build optimizedDebug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleOptimizedDebug -PenableX86=true --no-daemon --stacktrace

      - name: Get short commit hash
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP '^siliconplayer\.version=\K.+' gradle.properties)
          echo "version_base=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "version_name=${VERSION_NAME}-optdebug" >> "$GITHUB_OUTPUT"

      - name: Prepare artifacts
        run: |
          mkdir -p artifact
          find app/build/outputs -type f -name "*.apk" | grep -i optimizeddebug | while read -r APK; do
            ABI=$(basename "$APK" | sed -n 's/.*app-\(.*\)-optimizedDebug\.apk/\1/p')
            [ -n "$ABI" ] || continue
            cp "$APK" "artifact/SiliconPlayer-${{ steps.version.outputs.version_name }}-${{ steps.vars.outputs.short_sha }}-$ABI.apk"
          done
          ls -la artifact/

      - name: Upload arm64-v8a artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconPlayer-${{ steps.version.outputs.version_name }}-${{ steps.vars.outputs.short_sha }}-arm64-v8a
          path: artifact/*arm64-v8a.apk
          if-no-files-found: error

      - name: Upload armeabi-v7a artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconPlayer-${{ steps.version.outputs.version_name }}-${{ steps.vars.outputs.short_sha }}-armeabi-v7a
          path: artifact/*armeabi-v7a.apk
          if-no-files-found: error

      - name: Upload x86_64 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconPlayer-${{ steps.version.outputs.version_name }}-${{ steps.vars.outputs.short_sha }}-x86_64
          path: artifact/*x86_64.apk
          if-no-files-found: error

      - name: Upload x86 artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconPlayer-${{ steps.version.outputs.version_name }}-${{ steps.vars.outputs.short_sha }}-x86
          path: artifact/*-x86.apk
          if-no-files-found: error

  desktop:
    name: Build desktop packages
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake libtool pkg-config cmake ninja-build perl
          sudo apt-get install -y xa65 || sudo apt-get install -y xa
          sudo apt-get install -y libasound2-dev libpulse-dev libx11-dev libgl1-mesa-dev zlib1g-dev
          sudo apt-get install -y libfuse2 fakeroot
          command -v xa

      - name: Configure git identity for patch application
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Compute desktop deps cache key
        id: deps-cache-key
        shell: bash
        run: |
          set -euo pipefail
          EXTERNAL_TREE_HASH="$(git rev-parse HEAD:external)"
          echo "key=desktop-deps-${{ runner.os }}-x86_64-${EXTERNAL_TREE_HASH}" >> "${GITHUB_OUTPUT}"

      - name: Restore desktop deps cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          path: desktop/prebuilt
          key: ${{ steps.deps-cache-key.outputs.key }}

      - name: Build desktop native dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          chmod +x external/build_deps*.sh
          BUILD_FFMPEG_SOURCE=1 ./external/build_deps_desktop.sh x86_64 all

      - name: Build release distributable
        run: |
          chmod +x gradlew
          ./gradlew :desktop:createReleaseDistributable --no-daemon --stacktrace

      - name: Package AppImage
        run: ./desktop/package-appimage.sh

      - name: Package deb and bare tarball
        run: |
          ./desktop/package-deb.sh
          ./desktop/package-tarball.sh

      - name: Get short commit hash
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP '^siliconplayer\.version=\K.+' gradle.properties)
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconPlayer-${{ steps.version.outputs.version_name }}-${{ steps.vars.outputs.short_sha }}-x86_64-appimage
          path: desktop/build/compose/binaries/main-release/SiliconPlayer-*.AppImage
          if-no-files-found: error

      - name: Upload deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconPlayer-${{ steps.version.outputs.version_name }}-${{ steps.vars.outputs.short_sha }}-x86_64-deb
          path: desktop/build/compose/binaries/main-release/SiliconPlayer-*.deb
          if-no-files-found: error

      - name: Upload bare tarball artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconPlayer-${{ steps.version.outputs.version_name }}-${{ steps.vars.outputs.short_sha }}-x86_64-bare
          path: desktop/build/compose/binaries/main-release/SiliconPlayer-*.tar.gz
          if-no-files-found: error

  arch:
    name: Build Arch package
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: archlinux:base-devel
    env:
      JAVA_TOOL_OPTIONS: -Dfile.encoding=UTF8

    steps:
      - name: Restore pacman package cache
        uses: actions/cache@v4
        with:
          path: /var/cache/pacman/pkg
          key: arch-pacman-pkgs
          restore-keys: arch-pacman-pkgs

      - name: Install container prerequisites
        run: |
          pacman -Syu --noconfirm git sudo
          useradd -m builder
          printf 'builder ALL=(ALL) NOPASSWD: ALL\n' > /etc/sudoers.d/builder
          mkdir -p /home/builder/.gradle

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Mark workspace as git safe directory
        run: |
          # In container jobs the checkout lands owned by the host uid, so
          # every local git invocation trips over dubious ownership. The
          # system config covers both root steps and su builder commands.
          git config --system --add safe.directory "${GITHUB_WORKSPACE}"

      - name: Compute desktop deps cache key
        id: deps-cache-key
        shell: bash
        run: |
          set -euo pipefail
          EXTERNAL_TREE_HASH="$(git rev-parse HEAD:external)"
          echo "key=desktop-deps-${{ runner.os }}-x86_64-${EXTERNAL_TREE_HASH}" >> "${GITHUB_OUTPUT}"

      - name: Restore desktop deps cache
        id: deps-cache
        uses: actions/cache@v4
        with:
          # Same key as the desktop job: identical script, identical
          # outputs, so a warm desktop cache skips the dep build here too.
          # desktop/prebuilt is gitignored, so it is staged into the
          # makepkg tree by copy below instead of via the git source.
          path: ${{ github.workspace }}/desktop/prebuilt
          key: ${{ steps.deps-cache-key.outputs.key }}

      - name: Restore Gradle home cache
        uses: actions/cache@v4
        with:
          path: /home/builder/.gradle
          key: arch-gradle-${{ hashFiles('gradle/wrapper/gradle-wrapper.properties', '**/*.gradle.kts') }}
          restore-keys: arch-gradle-

      - name: Fix cache ownership for builder
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/desktop/prebuilt"
          chown -R builder:builder /home/builder/.gradle "${GITHUB_WORKSPACE}/desktop/prebuilt"

      - name: Get short commit hash
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP '^siliconplayer\.version=\K.+' gradle.properties)
          echo "version_name=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build package
        run: |
          set -euo pipefail
          rm -rf /tmp/archpkg && mkdir -p /tmp/archpkg/src
          cp -a "${GITHUB_WORKSPACE}" /tmp/archpkg/src/siliconplayer
          cp desktop/packaging/arch/PKGBUILD desktop/packaging/arch/siliconplayer.sh desktop/packaging/arch/siliconplayer.desktop /tmp/archpkg/
          chown -R builder:builder /tmp/archpkg
          su builder -c 'cd /tmp/archpkg && makepkg -se --noconfirm'

      - name: Upload Arch package artifact
        uses: actions/upload-artifact@v4
        with:
          name: SiliconPlayer-${{ steps.version.outputs.version_name }}-${{ steps.vars.outputs.short_sha }}-x86_64-pkg
          path: /tmp/archpkg/siliconplayer-*.pkg.tar.zst
          if-no-files-found: error

  publish:
    name: Publish experimental release
    needs: [build, desktop, arch]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: SiliconPlayer-*
          merge-multiple: true
          path: release-artifacts/

      - name: Get short commit hash
        id: vars
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - name: Get app version
        id: version
        run: |
          VERSION_NAME=$(grep -oP '^siliconplayer\.version=\K.+' gradle.properties)
          echo "version_base=${VERSION_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish experimental release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION_BASE: ${{ steps.version.outputs.version_base }}
          SHORT_SHA: ${{ steps.vars.outputs.short_sha }}
          BUILD: ${{ github.run_number }}
        run: |
          set -euo pipefail
          TAG="experimental"

          if PREV_SHA=$(git rev-parse -q --verify refs/tags/experimental 2>/dev/null); then
            CHANGELOG=$(git log --format='- %h %s' "${PREV_SHA}..HEAD" | grep -v '^-[ ]*[0-9a-f]\+ ci:' || true)
            [ -n "$CHANGELOG" ] || CHANGELOG="- No code changes since the previous build"
          else
            CHANGELOG=$(git log --format='- %h %s' -15 HEAD)
          fi

          NOTES=$(printf '%s\n\n## Changes\n%s\n' \
            "Experimental build from commit ${SHORT_SHA}. This build is auto-generated on every master push; expect instability." \
            "$CHANGELOG")

          gh release delete "$TAG" --cleanup-tag --yes || true

          gh release create "$TAG" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "SiliconPlayer ${VERSION_BASE} (build ${BUILD})" \
            --notes "$NOTES" \
            release-artifacts/SiliconPlayer-*.apk \
            release-artifacts/SiliconPlayer-*.AppImage \
            release-artifacts/SiliconPlayer-*.deb \
            release-artifacts/SiliconPlayer-*.tar.gz \
            release-artifacts/siliconplayer-[0-9]*.pkg.tar.zst
